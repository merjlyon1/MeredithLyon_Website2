<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Claim Error</title>

  <style>

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;

      display: grid;
      place-items: center;

      background: #c0c0c0;
      color: #000;

      font-family:
        "Times New Roman",
        serif;
    }

    .error-window {
      width: min(84vw, 440px);

      border: 3px outset #ddd;

      background: #c0c0c0;

      box-shadow:
        8px 8px 0 rgba(0,0,0,.65);
    }

    .error-titlebar {
      padding: 5px 8px;

      background: #000080;
      color: #fff;

      font-family:
        Arial,
        sans-serif;

      font-size: 13px;
      font-weight: bold;
    }

    .error-body {
      padding: 34px;

      text-align: center;
    }

    .error-face {
      margin: 0 0 18px;

      font-family:
        monospace;

      font-size: 48px;
    }

    h1 {
      margin: 0 0 15px;

      font-size: 28px;
    }

    p {
      margin:
        0 0 24px;

      font-size: 17px;
    }

    a {
      display: inline-block;

      padding: 8px 12px;

      border: 3px outset #ddd;

      background: #c0c0c0;
      color: #000;

      text-decoration: none;
    }

    a:active {
      border-style: inset;
    }

  </style>

</head>


<body>

  <div class="error-window">

    <div class="error-titlebar">
      MAKING MONEY LOTTERY
    </div>

    <div class="error-body">

      <p class="error-face">
        :-(
      </p>

      <h1>
        CLAIM ERROR
      </h1>

      <p>
        Your transaction could not be completed.
      </p>

      <p>
        Please try again later.
      </p>

      <a href="game.html">
        OK
      </a>

    </div>

  </div>

</body>

</html>
